name: Organize Zoom Transcripts

# Scans Zoom Cloud for new meeting transcripts, organizes them, and emails
# them via the Gmail API. Runs on a schedule and can also be triggered by hand.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ZOOM_ACCOUNT_ID, ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET
#   GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN
# Optional secrets / variables:
#   GMAIL_SENDER        (the mailbox the refresh token belongs to)
#   ANTHROPIC_API_KEY   (enables AI summary + action items by person)
#   ZOOM_USER_ID, TRANSCRIPT_RECIPIENT, LOOKBACK_DAYS  (vars)
# See automation/README.md for full setup instructions.

on:
  schedule:
    # Every 2 hours. Adjust to taste (cron is UTC).
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to scan"
        required: false
        default: "7"

concurrency:
  group: zoom-transcript-organizer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Organize and email transcripts
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_USER_ID: ${{ vars.ZOOM_USER_ID || 'me' }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER || 'me' }}
          TRANSCRIPT_RECIPIENT: ${{ vars.TRANSCRIPT_RECIPIENT || 'joshua@demanddesigner.com' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || vars.LOOKBACK_DAYS || '7' }}
        run: python automation/organize_zoom_transcripts.py

      - name: Persist processed-transcript state
        run: |
          if ! git diff --quiet -- .github/zoom-transcript-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/zoom-transcript-state.json
            git commit -m "chore: update Zoom transcript state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
